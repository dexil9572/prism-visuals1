name: Build Prism Visuals

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build
        run: gradle --no-daemon build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: prism-visuals-jar
          path: build/libs/prism-visuals-*.jar
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-mc26.2
          name: Prism Visuals 1.0.1 — Minecraft 26.2 (Fabric)
          body: |
            Клиентский визуальный мод **Prism Visuals** для **Minecraft 26.2 (Fabric)**.

            Что нужно: Fabric Loader `0.19.0+` для 26.2 (рекомендуется 0.19.3), Fabric API `0.161.0+26.2`, Java 25.
            Кидай `prism-visuals-1.0.1.jar` и Fabric API в папку `mods`.

            Управление: **Right Shift** — меню модулей, **C** (зажать) — зум, **G** — автоспринт.
            Конфиг: `.minecraft/config/prism.json`
          overwrite_files: true
          files: build/libs/prism-visuals-*.jar
          make_latest: true
