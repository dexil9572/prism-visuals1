name: Build Prism Visuals

on:
  push:
    paths-ignore:
      - 'api-dump/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build
        run: gradle --no-daemon --stacktrace build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: prism-visuals-jar
          path: build/libs/*.jar
          if-no-files-found: error
