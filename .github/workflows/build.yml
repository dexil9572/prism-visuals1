name: Build Prism Visuals

on:
  push:
    paths-ignore:
      - 'api-dump/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain build > build-log.txt 2>&1
          echo "GRADLE_EXIT=$?" >> build-log.txt
          tail -c 200000 build-log.txt
          grep -q "GRADLE_EXIT=0" build-log.txt

      - name: Commit build log (failed builds only)
        if: failure()
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-log.txt
          git commit -m "chore: build log [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prism-visuals-jar
          path: build/libs/*.jar
          if-no-files-found: error
