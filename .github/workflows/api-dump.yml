name: API Dump

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/api-dump.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Resolve dependencies
        run: gradle --no-daemon build --continue || true

      - name: Dump Minecraft + Fabric API signatures
        run: |
          set -eu
          mkdir -p api-dump
          MCJAR=$(for j in $(find ~/.gradle/caches/fabric-loom -name '*.jar'); do if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class'; then echo "$j"; fi; done | head -1)
          echo "MCJAR=$MCJAR" > api-dump/info.txt
          find ~/.gradle/caches/fabric-loom -name '*.jar' >> api-dump/info.txt

          unzip -l "$MCJAR" | awk '{print $4}' | grep '\.class$' | sed 's#/#.#g; s#\.class$##' | sort > api-dump/classes.txt

          : > api-dump/javap.txt
          for c in \
            net.minecraft.client.Minecraft \
            net.minecraft.client.Options \
            net.minecraft.client.KeyMapping \
            'net.minecraft.client.KeyMapping$Category' \
            net.minecraft.client.CameraType \
            net.minecraft.client.DeltaTracker \
            net.minecraft.client.OptionInstance \
            'net.minecraft.client.OptionInstance$ValueSet' \
            'net.minecraft.client.OptionInstance$IntRange' \
            'net.minecraft.client.OptionInstance$DoubleSliderCallbacks' \
            net.minecraft.client.gui.Gui \
            net.minecraft.client.gui.Hud \
            net.minecraft.client.gui.GuiGraphicsExtractor \
            net.minecraft.client.gui.Font \
            net.minecraft.client.gui.screens.Screen \
            net.minecraft.client.gui.components.events.GuiEventListener \
            net.minecraft.client.gui.components.Renderable \
            net.minecraft.client.renderer.GameRenderer \
            net.minecraft.client.renderer.ScreenEffectRenderer \
            net.minecraft.client.renderer.Lightmap \
            net.minecraft.client.renderer.OrderedSubmitNodeCollector \
            net.minecraft.client.renderer.rendertype.RenderType \
            net.minecraft.client.renderer.rendertype.RenderTypes \
            net.minecraft.client.renderer.state.level.BlockOutlineRenderState \
            net.minecraft.client.player.LocalPlayer \
            net.minecraft.client.player.ClientInput \
            net.minecraft.client.multiplayer.ClientLevel \
            net.minecraft.world.entity.player.Player \
            net.minecraft.world.entity.player.Inventory \
            net.minecraft.world.entity.player.Input \
            net.minecraft.world.entity.Entity \
            net.minecraft.world.item.ItemStack \
            net.minecraft.world.phys.AABB \
            net.minecraft.world.phys.BlockHitResult \
            net.minecraft.world.phys.EntityHitResult \
            net.minecraft.world.phys.HitResult \
            net.minecraft.world.phys.Vec3 \
            net.minecraft.world.level.Level \
            net.minecraft.world.level.storage.LevelData \
            net.minecraft.network.chat.Component \
            net.minecraft.resources.Identifier \
            net.minecraft.resources.ResourceKey \
            net.minecraft.core.Holder \
            net.minecraft.util.ARGB \
            net.minecraft.util.Util \
            com.mojang.blaze3d.vertex.PoseStack \
            com.mojang.blaze3d.vertex.VertexConsumer \
            com.mojang.blaze3d.platform.InputConstants \
            'net.minecraft.client.OptionInstance$UnitDouble' \
            'net.minecraft.client.input.MouseButtonEvent' \
            'net.minecraft.client.input.KeyEvent' \
            net.minecraft.world.entity.LivingEntity \
            net.minecraft.world.entity.EquipmentSlot \
            'net.minecraft.util.Util$OS' \
            net.minecraft.world.clock.ClockManager \
            net.minecraft.client.ClientClockManager \
            net.minecraft.world.clock.WorldClock \
            net.minecraft.world.clock.WorldClocks \
            net.minecraft.world.phys.Vec2 \
            net.minecraft.client.renderer.state.level.SkyRenderState \
            net.minecraft.client.gui.ActiveTextCollector \
            net.minecraft.world.entity.EntityEquipment \
            'com.mojang.blaze3d.platform.InputConstants$Type' ; do
            echo "##### $c" >> api-dump/javap.txt
            javap -p -classpath "$MCJAR" "$c" >> api-dump/javap.txt 2>&1 || true
          done

          : > api-dump/fabric.txt
          for j in $(find ~/.gradle/caches/modules-2 -name '*.jar' | grep -E 'fabric-(rendering-v1|key-mapping-api-v1|lifecycle-events-v1|events-interaction-v0|screen-api-v1)' | grep -v sources | sort -u); do
            echo "##### $j" >> api-dump/fabric.txt
            unzip -l "$j" | awk '{print $4}' | grep '\.class$' | grep -E 'api/' >> api-dump/fabric.txt || true
          done
          wc -l api-dump/*.txt >> api-dump/info.txt

      - name: Commit dump
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f api-dump
          git commit -m "chore: api dump [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
